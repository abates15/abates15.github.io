<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Nebraskan Costume Match</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Optional: Add a little style for the image on the landing page */
        #landing-page img {
            max-width: 250px; /* Adjust size as needed */
            height: auto;
            margin: 20px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="landing-page" class="screen active">
        <h1>Daily Nebraskan Costume Match</h1>
        
        <img src="DN.jpg" alt="Daily Nebraskan Logo">
        
        <button id="start-button">Start</button>
    </div>

    <div id="game-screen" class="screen">
        <p id="instructions">The DN needs you to match up all of the costumes!</p>
        <div id="game-board" class="card-grid">
            </div>
    </div>

    <div id="win-screen" class="screen">
        <div id="confetti">🎃 👻 🕸️ 🦇</div>
        <h2>Congrats!</h2>
        <p>Read more: <a href="https://www.dailynebraskan.com/" target="_blank">https://www.dailynebraskan.com/</a></p>
        <button id="play-again-button">Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
