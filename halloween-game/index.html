<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DN Halloweekend Costume Judgment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DN Halloweekend Costume Judgment</h1>
        <p>The **Daily Nebraskan** writers are watching! Choose a costume that is **unique** and **not overdone**.</p>
    </header>

    <div id="game-container">
        <h2>Choose Your Costume for Halloweekend:</h2>
        
        <div id="costume-options">
            <label><input type="radio" name="costume" value="jersey"> 1. Sports Jersey/Athlete (Boring/Lazy)</label><br>
            <label><input type="radio" name="costume" value="angel_devil"> 2. Angel or Devil (Overdone Classic)</label><br>
            <label><input type="radio" name="costume" value="kiss_kill"> 3. Kiss, Marry, Kill Trio (Outdated Trend)</label><br>
            <label><input type="radio" name="costume" value="lifeguard"> 4. Lifeguard (Easy Route)</label><br>

            <label><input type="radio" name="costume" value="minecraft_steve"> 5. 'Minecraft' Steve (Culturally Relevant)</label><br>
            <label><input type="radio" name="costume" value="iconic_artist"> 6. Iconic Artist Fit (Show Personality)</label><br>
            <label><input type="radio" name="costume" value="priscilla"> 7. Priscilla Presley Polka Dot Set (Niche Reference)</label><br>
            <label><input type="radio" name="costume" value="ghost"> 8. Simple Ghost (Approved Alternative)</label><br>
        </div>
        
        <button onclick="getJudgment()">Go to the Party!</button>
        
        <div id="result-message">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
