<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DN Halloween Party Dress Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>DN Halloween Party Dress Up</h1>
        <p>Help the mummy choose a costume the writers will approve of! Avoid the 'boring and lazy' ones.</p>
    </header>

    <div id="game-container">

        <div id="costume-choices-left" class="costume-panel">
            <h3>Bad Costumes (Avoid!)</h3>
            <div id="jersey" class="costume-item" data-type="bad">Sports Jersey</div>
            <div id="devil" class="costume-item" data-type="bad">Devil Horns & Wings</div>
            <div id="kiss-kill" class="costume-item" data-type="bad">Red/Black Dress</div>
        </div>

        <div id="character-area">
            <div id="mummy-base"></div>
            <div id="costume-layer">
                </div>
            <div id="judgement-message"></div>
        </div>

        <div id="costume-choices-right" class="costume-panel">
            <h3>Good Costumes (Choose!)</h3>
            <div id="chappell-roan" class="costume-item" data-type="good">Sparkly Dress & Red Wig</div>
            <div id="witch" class="costume-item" data-type="good">Witch Hat & Broom</div>
            <div id="fairy" class="costume-item" data-type="good">Fairy Wings & Wand</div>
        </div>

    </div>

    <button id="continue-button">Continue to be Judged!</button>

    <script src="script.js"></script>
</body>
</html>
