<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloweekend Quest</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="game-container">
        <h1>🎃 Halloweekend Quest 🧠</h1>
        <h2>A Daily Nebraskan Learning Game</h2>

        <div id="board-path">
            </div>

        <div id="message-panel">
            <p id="message" class="message-text">Press START to begin your Halloweekend Quest!</p>
            <p id="player-status" class="status-text">Current Position: Space 1 / 12</p>
        </div>

        <div id="controls">
            <button id="startButton" onclick="initializeGame()">START GAME</button>
            
            <div id="ttt-area" class="hidden">
                <h3>👻 Tic-Tac-Toe Gate 👻</h3>
                <p>Win against the computer (O) to earn your dice roll!</p>
                <div id="ttt-board">
                    </div>
            </div>

            <div id="dice-container" class="hidden">
                <p>Click the dice to roll (1-3):</p>
                <div id="dice-click-area" onclick="rollDice()">
                    <i id="dice-icon" class="fas fa-dice-three fa-4x"></i>
                    <span id="dice-value" class="hidden">3</span>
                </div>
            </div>
            
            <button id="rollButton" class="hidden" disabled>ROLL DICE (1-3)</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
